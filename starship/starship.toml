"$schema" = 'https://starship.rs/config-schema.json'

# Single-line prompt with a right-side prompt.
# Uses only your terminal's ANSI colors (no hex values, no custom palette),
# so it follows whatever color scheme your terminal is set to.
add_newline = false

format = "$directory$git_branch$character"
right_format = "$git_status$cmd_duration"

# ~/starship-prompts  (folder icon, bold path)
[directory]
format = "[\uf07b ](purple)[$path]($style)[$read_only]($read_only_style)  "
style = "bold blue"
read_only = " \U000F033E"
read_only_style = "red"
home_symbol = "~"
truncation_length = 3
truncate_to_repo = false

# main  (cat icon + branch name)
[git_branch]
format = "[\uf113 ](green)[$branch]($style) "
style = "blue"

# !2✓  (right side)
[git_status]
format = "[$modified$staged]($style) "
style = "yellow"
modified = "!${count}"
staged = "✓"
untracked = ""
ahead = ""
behind = ""
diverged = ""
deleted = ""
renamed = ""
stashed = ""
conflicted = ""

# 0s with a timer icon (shown even for instant commands)
[cmd_duration]
min_time = 0
show_milliseconds = false
format = "[\U000F051A ](purple)[$duration]($style) "
style = ""

# Dot as the prompt character
[character]
success_symbol = "[●](green) "
error_symbol = "[●](red) "
vimcmd_symbol = "[●](blue) "
